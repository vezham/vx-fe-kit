# @vx/INFO: @vx/ci
name: books | bnd

on:
  workflow_dispatch:
  push:
    branches: [timeline, feat/*]
    paths:
      - '.github/workflows/books.yml'
      - 'vx/handbooks/ci.md'
      - 'vx/config/firebase/apps/books.json'
      - 'vx/config/vercel/__mocks__/mock.json'
      - 'packages/**'
      # - 'apps/books/**' # @vx/TODO: sync changes
      # - 'apps/books-e2e/**'
      - 'apps/ts4/**'

jobs:
  run_if:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.filter.outputs.all }}
      deploy: ${{ steps.filter.outputs.deploy }}
      mocks: ${{ steps.filter.outputs.mocks }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            all:
              - '.github/workflows/books.yml'
              - 'vx/handbooks/ci.md'
            deploy:
              - 'vx/config/firebase/apps/books.json'
              - 'apps/books/!(__mocks__/**)/**'
              - 'packages/**'
            mocks:
              - 'vx/config/vercel/__mocks__/mock.json'
              - 'apps/books/__mocks__/**'

  deploy:
    needs: run_if
    if: ${{ needs.run_if.outputs.all == 'true' || needs.run_if.outputs.deploy == 'true' }}
    name: books | ${{ github.ref_name }}
    uses: vezham/vx-fe-deployer/.github/workflows/apps-books.yml@timeline
    secrets: inherit
    with:
      CALLER: ${{ github.ref_name }}

  # mocks: # wjdlz/TODO: need to support mock
