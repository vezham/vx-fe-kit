packages:
  - 'packages/**'
  - 'apps/**'
  - 'apps_*/*'

# Enable package lifecycle scripts.
enablePrePostScripts: true

# Hoist internal packages so tools relying on Node.js resolution
# (e.g. Storybook, Vite plugins, ESLint, etc.) can resolve them consistently.
publicHoistPattern:
  - '*@vezham/*'
  - '*@vx-oss/*'
  - '*@vx-pro/*'

minimumReleaseAge: 10080 # wjdlz/NOTE: days in minutes - 5 = 7200, 7 = 10080, 14 = 20160
minimumReleaseAgeExclude:
  - '@vx-cli/*'
  - '@vx-oss/*'
  - '@vezham/*'
  # vx-bot/TODO: Remove after 2026-09-26 22:35 IST (seven-day release age).
  - '@heroui/react@3.2.6'
  - '@heroui/styles@3.2.6'
  # vx-bot/TODO: Remove after 2026-09-26 22:35 IST (seven-day release age).
  - '@heroui-pro/react@1.0.0-beta.10'

allowBuilds:
  heroui-pro: true
  '@heroui-pro/react': true
  heroui-native-pro: true
  lightningcss: true
  esbuild: true
  '@parcel/watcher': false
  '@swc/core': false
  '@vx-oss/heroui-v2-shared-utils': false
  '@zowe/secrets-for-zowe-sdk': false
  less: false
  nx: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'eslint-import-resolver-typescript@3.10.1'
  - 'pino@9.14.0'
  - 'semver@5.7.2'
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'
